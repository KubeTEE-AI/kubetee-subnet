version: 2
updates:
  # Root Python project is uv-managed (pyproject.toml + uv.lock). Use the
  # dedicated `uv` ecosystem so Dependabot regenerates uv.lock alongside the
  # manifest pins; `pip` would bump pyproject.toml only and leave the lockfile
  # stale. The vendored SDK at subtensor/sdk/python is upstream's (pinned via
  # the `gitsubmodule` entry below) — not managed here.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(subnet)"
  - package-ecosystem: docker
    directory: "/validator"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "chore(subnet)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "chore(subnet)"
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - submodule
    commit-message:
      prefix: "chore(subnet)"
