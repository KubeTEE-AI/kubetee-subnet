name: Release validator image

on:
  push:
    tags: ["v*"]
    branches:
      - main
    paths:
      - "validator/**"
      - "subtensor/sdk/python/**"
      - ".github/workflows/release-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v3)"
        required: true
        default: "v3"

permissions:
  contents: read
  packages: write
  # Required by actions/attest-build-provenance (SLSA provenance + SBOM
  # attestation on the published image — verify with
  # `gh attestation verify oci://ghcr.io/kubetee-ai/kubetee-validator:<tag>`)
  id-token: write
  attestations: write

# All third-party actions are pinned to full commit SHAs (tag comments record
# the human-readable version). `zizmor` in CI enforces this.
jobs:
  build-and-push:
    name: build & push (amd64 + arm64)
    runs-on: ubuntu-latest
    # Dedicated environment scopes the GHCR_PAT secret to this release job
    # only (zizmor secrets-outside-env). Auto-created on first run; add
    # required reviewers here if release approval is ever wanted.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false

      - name: Resolve image tags
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # All values come from trusted GitHub context (env), not raw
          # interpolation in the shell. The shell reads them via $VAR.
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == v* ]]; then
            TAG="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Validate the input tag is a simple alphanumeric+dotted string
            # (reject anything with shell metacharacters)
            if [[ "$INPUT_TAG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              TAG="$INPUT_TAG"
            else
              echo "::error::invalid tag (must match [a-zA-Z0-9._-]+)"
              exit 1
            fi
          else
            TAG="sha-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Strip leading v for Dockerfile ARG VERSION / BT-Validator-Version.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          # For semver tags (v1.2.3), also push the major (v1) and minor
          # (v1.2) tags so Watchtower can track v1 and auto-upgrade within
          # the major. Non-semver tags (sha-xxx, v3, etc.) only push themselves.
          TAGS="ghcr.io/kubetee-ai/kubetee-validator:$TAG"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            TAGS="$TAGS
          ghcr.io/kubetee-ai/kubetee-validator:v$MAJOR
          ghcr.io/kubetee-ai/kubetee-validator:v$MAJOR.$MINOR"
          fi
          TAGS="$TAGS
          ghcr.io/kubetee-ai/kubetee-validator:latest"
          # Write as a multiline output for the build-push step
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: validator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/kubetee-ai/kubetee-validator
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
