[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubetee-validator"
version = "0.1.0"
description = "KubeTEE AI (SN90) subnet-owner Bittensor validator"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Pierre", email = "pierre@kubetee.ai" },
]
keywords = [
    "bittensor",
    "subnet",
    "confidential-computing",
    "tee",
    "kata",
    "coco",
    "validator",
    "decentralized",
    "gpu",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    # Official PyPI release, not the vendored SDK. Matches subtensor v491
    # (the release-train "SDK rc channel": the rc is the only artifact built
    # from the v491 tree and published after the testnet smoke suite; the
    # stable 11.3.2/0.1.9 pair is the older v488 vintage). rc82 = release-train
    # run 82; the SDK pins bittensor-core==0.1.11rc82 exactly so the pair
    # resolves together. Prebuilt abi3 wheels -- no Rust build. Verified
    # byte-identical to the v491 sdk/python tree and against live Finney
    # spec_version 491 (2026-11-17): metagraph reads, hyperparameters,
    # weights_rate_limit, and hotkey derivation.
    # Re-pin to stable 11.3.4/0.1.11 once the mainnet promotion publishes it.
    "bittensor==11.3.4rc82",
    "bittensor-core==0.1.11rc82",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.urls]
Homepage = "https://github.com/KubeTEE-AI/kubetee-subnet"
Repository = "https://github.com/KubeTEE-AI/kubetee-subnet"
Documentation = "https://github.com/KubeTEE-AI/kubetee-subnet/tree/main/docs"
"Bug Tracker" = "https://github.com/KubeTEE-AI/kubetee-subnet/issues"
Changelog = "https://github.com/KubeTEE-AI/kubetee-subnet/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
]

# The `validator/` directory is a flat unit of bare-import modules, not an
# importable package (no __init__.py), so there is nothing to install from it
# here; the SDK is the only packaged dependency. The Dockerfile copies the
# validator modules directly.
[tool.setuptools]
py-modules = []

[tool.black]
line-length = 79

[tool.pytest.ini_options]
testpaths = ["validator/tests"]
