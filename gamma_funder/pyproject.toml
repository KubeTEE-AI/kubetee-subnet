[build-system]
requires = ["hatchling>=1.29.4,<2"]
build-backend = "hatchling.build"

[project]
name = "kubetee-gamma-funder"
version = "0.1.0.dev0"
description = "Measured TEE SN90 Gamma redemption coordinator; pilot, not enabled"
requires-python = ">=3.13,<3.15"
# No unofficial substrate client. Bittensor 11.3.2 supplies its own native RPC
# transport. The official 11.3.2 client is locked with its matching
# bittensor-core 0.1.9 for SR25519 SS58 decoding. No third-party
# async-substrate-interface or forked wallet client is used.
dependencies = [
    "bittensor==11.3.2",
    "bittensor-core==0.1.9",
  # bittensor-core embeds the chain codec; do not add legacy py-substrate-interface.
    "bittensor-wallet==4.1.1",
    # Exact patched wheel: 46.0.7 is affected by CVE-2026-69247, CVE-2026-69249
    # and GHSA-537c-gmf6-5ccf. The chain SDK leaves this direct dep uncapped.
    "cryptography==50.0.2",
    "fastapi>=0.136.3,<1.0",
    "httpx>=0.28.0,<1",
    "pydantic>=2.12.0,<3.0.0",
    "redis>=7.1.0,<8",
    "uvicorn>=0.40.0,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "asgi-lifespan>=2.1.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
